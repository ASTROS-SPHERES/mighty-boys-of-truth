name: Finalize Mighty Vault Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-mighty-vault-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch verified artwork branch
        run: git fetch origin vault-final-direct64-install:refs/remotes/origin/vault-final-direct64-install --force

      - name: Install verified 64-card atlas
        run: |
          set -euo pipefail
          git show origin/vault-final-direct64-install:assets/mighty-vault-card-atlas.webp > assets/mighty-vault-card-atlas.webp
          echo 'ca0baab18c957767e8c1ff684c239208e922defb0cf144fe5b6d1f23ec4e999a  assets/mighty-vault-card-atlas.webp' | sha256sum -c -

      - name: Bump Vault artwork and cache versions
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("assets/mighty-vault.js"); s=p.read_text(); assert "V=\"20260902-visualfix4\"" in s; p.write_text(s.replace("V=\"20260902-visualfix4\"","V=\"20260903-final64\"",1))'
          python -c 'from pathlib import Path; p=Path("mighty-vault.html"); s=p.read_text(); assert "assets/mighty-vault.js?v=20260902-final" in s; p.write_text(s.replace("assets/mighty-vault.js?v=20260902-final","assets/mighty-vault.js?v=20260903-final64",1))'
          python -c 'from pathlib import Path; import re; p=Path("service-worker.js"); s=p.read_text(); s,n=re.subn(r"const CACHE_VERSION = .+?;","const CACHE_VERSION = '\''mbot-revamp-v14-vault-final64-20260903'\'';",s,count=1); assert n==1; p.write_text(s)'

      - name: Validate production Vault
        run: |
          set -euo pipefail
          node --check assets/mighty-vault.js
          node --check assets/site.js
          python scripts/verify-mighty-vault.py
          python -c 'from pathlib import Path; import hashlib,struct; b=Path("assets/mighty-vault-card-atlas.webp").read_bytes(); assert hashlib.sha256(b).hexdigest()=="ca0baab18c957767e8c1ff684c239208e922defb0cf144fe5b6d1f23ec4e999a"; assert b[:4]==b"RIFF" and b[8:12]==b"WEBP" and struct.unpack_from("<I",b,4)[0]+8==len(b); print("Final 64-card atlas verified")'

      - name: Commit production finalization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mighty-vault-card-atlas.webp assets/mighty-vault.js mighty-vault.html service-worker.js
          git commit -m 'Finalize Mighty Vault 64-card production artwork'
          git push origin HEAD:main
