name: Vault Strip Recovery Analysis

on:
  push:
    branches: [vault-recovery-analysis]
    paths:
      - '.github/workflows/vault-strip-analysis.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch artwork recovery branch
        run: git fetch origin vault-art-fix-test:vault-art-fix-test
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Analyze and export recoverable card strips
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vault-strips /tmp/vault-crops
          mkdir -p /tmp/vault-strips /tmp/vault-crops
          for p in \
            assets/vault-strips/strip-01.webp.b64 \
            assets/vault-strips/strip-02.webp.b64 \
            assets/vault-strips/strip-03.webp.b64 \
            assets/vault-strips/strip-04.webp.b64 \
            assets/vault-art-8/strip-01.webp.b64 \
            assets/vault-art-8/strip-02.webp.b64 \
            assets/vault-pairs/pair-01.webp.b64; do
            safe=$(echo "$p" | tr '/' '_' | sed 's/.webp.b64$//')
            git show vault-art-fix-test:"$p" > "/tmp/vault-strips/$safe.b64"
            base64 --decode "/tmp/vault-strips/$safe.b64" > "/tmp/vault-strips/$safe.webp"
          done
          python <<'PY'
          import base64, glob, io, math, os, re
          from PIL import Image, ImageChops, ImageStat, ImageDraw

          pat=re.compile(r'"(HMM-\d{3})":"data:image/webp;base64,([A-Za-z0-9+/=]+)"')
          known={}
          for path in glob.glob('assets/mighty-vault/card-data/*.js'):
              text=open(path,encoding='utf-8').read()
              for cid,b64 in pat.findall(text):
                  try:
                      raw=base64.b64decode(b64,validate=True)
                      im=Image.open(io.BytesIO(raw)); im.load()
                      known[cid]=im.convert('RGB')
                  except Exception:
                      pass
          for cid,path in [('HMM-062','assets/vault-aquila.webp'),('HMM-063','assets/vault-lydia.webp'),('HMM-064','assets/vault-phoebe.webp')]:
              if os.path.exists(path):
                  im=Image.open(path); im.load(); known[cid]=im.convert('RGB')
          print('KNOWN_VALID', len(known), sorted(known))

          def signature(im): return im.convert('RGB').resize((48,72))
          sig={k:signature(v) for k,v in known.items()}
          def rmse(a,b):
              stat=ImageStat.Stat(ImageChops.difference(a,b))
              return math.sqrt(sum(v*v for v in stat.rms)/3)

          manifest=[]
          thumbs=[]
          for path in sorted(glob.glob('/tmp/vault-strips/*.webp')):
              im=Image.open(path); im.load(); w,h=im.size
              base=os.path.basename(path).replace('.webp','')
              candidates=[]
              for n in (2,4,8):
                  if w % n: continue
                  cw=w//n; ratio=cw/h
                  if 0.45 <= ratio <= 0.85:
                      candidates.append((abs(ratio-70/120),n,cw))
              print('\nSTRIP',base,'SIZE',w,h)
              if not candidates:
                  print('  NO_PLAUSIBLE_SPLIT'); continue
              _,n,cw=min(candidates)
              print('  SPLIT',n,'CELL',cw,h)
              for i in range(n):
                  crop=im.crop((i*cw,0,(i+1)*cw,h)).convert('RGB')
                  out=f'/tmp/vault-crops/{base}-cell-{i+1:02d}.webp'
                  crop.save(out,'WEBP',quality=95)
                  cs=signature(crop)
                  ranked=sorted((rmse(cs,s),cid) for cid,s in sig.items())[:3]
                  best='; '.join(f'{cid}:{score:.2f}' for score,cid in ranked)
                  print('  CELL',i+1,'BEST',best)
                  manifest.append(f'{os.path.basename(out)}\t{best}')
                  thumb=crop.resize((168,266))
                  canvas=Image.new('RGB',(188,300),'white')
                  canvas.paste(thumb,(10,10))
                  d=ImageDraw.Draw(canvas)
                  d.text((10,280),f'{base} #{i+1}',fill='black')
                  thumbs.append(canvas)
          open('/tmp/vault-crops/manifest.txt','w').write('\n'.join(manifest)+'\n')
          if thumbs:
              cols=4; rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new('RGB',(cols*188,rows*300),'white')
              for j,t in enumerate(thumbs): sheet.paste(t,((j%cols)*188,(j//cols)*300))
              sheet.save('/tmp/vault-crops/contact-sheet.jpg',quality=94)
          PY
      - name: Upload crop audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-strip-crops
          path: /tmp/vault-crops
          retention-days: 1
