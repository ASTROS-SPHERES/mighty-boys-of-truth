name: Vault Strip Recovery Analysis

on:
  push:
    branches: [vault-recovery-analysis]
    paths:
      - '.github/workflows/vault-strip-analysis.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch artwork recovery branch
        run: git fetch origin vault-art-fix-test:vault-art-fix-test
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Analyze strips and match known cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vault-strips /tmp/known
          for p in \
            assets/vault-strips/strip-01.webp.b64 \
            assets/vault-strips/strip-02.webp.b64 \
            assets/vault-strips/strip-03.webp.b64 \
            assets/vault-strips/strip-04.webp.b64 \
            assets/vault-art-8/strip-01.webp.b64 \
            assets/vault-art-8/strip-02.webp.b64 \
            assets/vault-pairs/pair-01.webp.b64; do
            safe=$(echo "$p" | tr '/' '_')
            git show vault-art-fix-test:"$p" > "/tmp/vault-strips/$safe.b64"
            base64 --decode "/tmp/vault-strips/$safe.b64" > "/tmp/vault-strips/$safe.webp"
          done
          python <<'PY'
          import base64, glob, io, math, os, re
          from PIL import Image, ImageChops, ImageStat

          # Recover every valid direct card currently staged on this branch.
          pat=re.compile(r'"(HMM-\d{3})":"data:image/webp;base64,([A-Za-z0-9+/=]+)"')
          known={}
          for path in glob.glob('assets/mighty-vault/card-data/*.js'):
              text=open(path,encoding='utf-8').read()
              for cid,b64 in pat.findall(text):
                  try:
                      raw=base64.b64decode(b64,validate=True)
                      im=Image.open(io.BytesIO(raw)); im.load()
                      known[cid]=im.convert('RGB')
                  except Exception:
                      pass
          for cid,path in [('HMM-062','assets/vault-aquila.webp'),('HMM-063','assets/vault-lydia.webp'),('HMM-064','assets/vault-phoebe.webp')]:
              if os.path.exists(path):
                  im=Image.open(path); im.load(); known[cid]=im.convert('RGB')
          print('KNOWN_VALID', len(known), sorted(known))

          def signature(im):
              # comparison signature robust to different compression and dimensions
              x=im.convert('RGB').resize((48,72))
              return x
          sig={k:signature(v) for k,v in known.items()}
          def rmse(a,b):
              d=ImageChops.difference(a,b)
              stat=ImageStat.Stat(d)
              return math.sqrt(sum(v*v for v in stat.rms)/3)

          for path in sorted(glob.glob('/tmp/vault-strips/*.webp')):
              im=Image.open(path); im.load(); w,h=im.size
              print('\nSTRIP', os.path.basename(path), 'SIZE', w,h, 'RATIO', round(w/h,4))
              # Evaluate likely horizontal card counts 2 and 8; use whichever cell is portrait-like.
              candidates=[]
              for n in (2,8):
                  if w % n: continue
                  cw=w//n
                  ratio=cw/h
                  if 0.45 <= ratio <= 0.85:
                      candidates.append((abs(ratio-70/120),n,cw))
              if not candidates:
                  print('  NO_PLAUSIBLE_SPLIT')
                  continue
              _,n,cw=min(candidates)
              print('  SPLIT', n, 'CELL', cw,h)
              for i in range(n):
                  crop=im.crop((i*cw,0,(i+1)*cw,h)).convert('RGB')
                  cs=signature(crop)
                  ranked=sorted((rmse(cs,s),cid) for cid,s in sig.items())[:3]
                  print('  CELL',i+1,'BEST', ', '.join(f'{cid}:{score:.2f}' for score,cid in ranked))
          PY
