name: Install Mighty Vault direct card assets

on:
  push:
    branches:
      - vault-direct-cards-final
    paths:
      - 'assets/mighty-vault/upload-parts/READY'

permissions:
  contents: write

jobs:
  install-card-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: vault-direct-cards-final
          fetch-depth: 0

      - name: Reconstruct and verify 64-card archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/mighty-vault/upload-parts -maxdepth 1 -name 'bundle-*.txt' | wc -l)" -eq 67
          cat $(find assets/mighty-vault/upload-parts -maxdepth 1 -name 'bundle-*.txt' | sort) | base64 --decode > /tmp/vault-card-assets.zip
          echo 'ca83c84737e8b093b39eb88eeb078f0def916a050abd3a03d9a73f0076a1a846  /tmp/vault-card-assets.zip' | sha256sum -c -
          unzip -o /tmp/vault-card-assets.zip -d .
          test "$(find assets/mighty-vault/cards -maxdepth 1 -name 'hmm-*.webp' | wc -l)" -eq 64

      - name: Commit clean direct Hero card library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mighty-vault/cards
          git rm -r assets/mighty-vault/upload-parts
          git rm -f assets/mighty-vault/vault-card-assets.zip || true
          git rm .github/workflows/install-vault-card-assets.yml
          git commit -m 'Install 64 direct Mighty Vault Hero card assets'
          git push origin HEAD:vault-direct-cards-final
