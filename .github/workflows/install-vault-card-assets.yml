name: Install Mighty Vault direct card assets

on:
  push:
    branches:
      - vault-direct-cards-final
    paths:
      - 'assets/mighty-vault/vault-card-assets.zip'

permissions:
  contents: write

jobs:
  install-card-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: vault-direct-cards-final
          fetch-depth: 0

      - name: Install and verify 64 direct Hero card assets
        shell: bash
        run: |
          set -euo pipefail
          unzip -o assets/mighty-vault/vault-card-assets.zip -d assets/mighty-vault/cards
          test "$(find assets/mighty-vault/cards -maxdepth 1 -name 'hmm-*.webp' | wc -l)" -eq 64

      - name: Commit clean direct Hero card library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mighty-vault/cards
          git rm assets/mighty-vault/vault-card-assets.zip
          git rm .github/workflows/install-vault-card-assets.yml
          git commit -m 'Install 64 direct Mighty Vault Hero card assets'
          git push origin HEAD:vault-direct-cards-final
